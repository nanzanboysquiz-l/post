<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <title>風景印保有局 (静岡県) | 郵便局マップ</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
        
        <!-- OpenLayers & qgis2web リソース -->
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">

        <style>
            :root {
                --primary-color: #d71920;
                --primary-dark: #b01016;
                --bg-glass: rgba(255, 255, 255, 0.92);
                --text-main: #2c3e50;
                --text-muted: #6c757d;
                --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
                --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
                --radius-md: 12px;
                --radius-lg: 16px;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html, body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                font-family: 'Zen Kaku Gothic New', system-ui, -apple-system, sans-serif;
                background-color: #f8f9fa;
                color: var(--text-main);
            }

            /* 全体レイアウト */
            .app-container {
                display: flex;
                flex-direction: column;
                width: 100vw;
                height: 100vh;
            }

            /* ヘッダー */
            header {
                height: 64px;
                background: #ffffff;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 1.5rem;
                z-index: 1000;
                box-shadow: var(--shadow-sm);
            }

            .header-left {
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .back-btn {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                padding: 0.45rem 0.9rem;
                background: #f1f3f5;
                color: var(--text-main);
                text-decoration: none;
                font-weight: 700;
                font-size: 0.85rem;
                border-radius: 8px;
                transition: all 0.2s ease;
            }

            .back-btn:hover {
                background: var(--primary-color);
                color: #ffffff;
                transform: translateX(-2px);
            }

            .header-title-group h1 {
                font-size: 1.25rem;
                font-weight: 900;
                color: var(--text-main);
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .header-title-group h1 span.badge-pref {
                background: var(--primary-color);
                color: #fff;
                font-size: 0.75rem;
                padding: 0.2rem 0.6rem;
                border-radius: 4px;
                vertical-align: middle;
            }

            /* マップコンテナ（レスポンシブ・全画面表示） */
            #map-wrapper {
                flex: 1;
                position: relative;
                width: 100%;
                height: calc(100vh - 64px);
            }

            #map {
                width: 100% !important;
                height: 100% !important;
            }

            /* OpenLayers UIコントロールの上書き・近代化 */
            .ol-control {
                background-color: var(--bg-glass) !important;
                backdrop-filter: blur(8px);
                border-radius: var(--radius-md) !important;
                padding: 4px !important;
                box-shadow: var(--shadow-sm) !important;
                border: 1px solid rgba(255, 255, 255, 0.8) !important;
            }

            .ol-control > * {
                background-color: transparent !important;
                color: var(--text-main) !important;
                border-radius: 8px !important;
                font-weight: bold;
                transition: background 0.2s ease;
            }

            .ol-control > *:focus, 
            .ol-control > *:hover {
                background-color: rgba(215, 25, 32, 0.1) !important;
                color: var(--primary-color) !important;
            }

            .ol-zoom {
                top: 1.5rem !important;
                left: 1.5rem !important;
            }

            .layer-switcher {
                top: 1.5rem !important;
                right: 1.5rem !important;
            }

            .gcd-gl-control {
                top: 1.5rem !important;
                left: 5rem !important;
            }

            .search-layer-input-search,
            .gcd-gl-input {
                border-radius: 8px !important;
                border: 1px solid #dee2e6 !important;
                padding: 0.4rem 0.8rem !important;
                font-family: inherit !important;
            }

            /* ポップアップUIのカスタマイズ */
            .ol-popup {
                position: absolute;
                background-color: var(--bg-glass);
                backdrop-filter: blur(12px);
                box-shadow: var(--shadow-md);
                padding: 1.25rem;
                padding-top: 1.5rem;
                border-radius: var(--radius-lg);
                border: 1px solid rgba(255, 255, 255, 0.9);
                bottom: 18px;
                left: 50%;
                transform: translateX(-50%);
                min-width: 280px;
                max-width: 360px;
                animation: popupFadeIn 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
                transform-origin: center bottom;
            }

            @keyframes popupFadeIn {
                from {
                    opacity: 0;
                    transform: translate(-50%, 10px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translate(-50%, 0) scale(1);
                }
            }

            .ol-popup::after, .ol-popup::before {
                top: 100%;
                border: solid transparent;
                content: " ";
                height: 0;
                width: 0;
                position: absolute;
                pointer-events: none;
                left: 50%;
                transform: translateX(-50%);
            }

            .ol-popup::after {
                border-top-color: rgba(255, 255, 255, 0.95);
                border-width: 10px;
            }

            /* ×ボタンのヒットエリア（当たり判定）の拡大 */
            .ol-popup-closer {
                text-decoration: none;
                position: absolute;
                top: 4px;
                right: 4px;
                width: 44px;
                height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                cursor: pointer;
                z-index: 10;
            }

            /* 見た目の円アイコン部分 */
            .ol-popup-closer::before {
                content: "";
                position: absolute;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: #f1f3f5;
                transition: all 0.2s ease;
                z-index: 1;
            }

            .ol-popup-closer::after {
                content: "✕";
                font-size: 0.8rem;
                font-weight: bold;
                color: var(--text-muted);
                z-index: 2;
                transition: color 0.2s ease;
            }

            .ol-popup-closer:hover::before {
                background: var(--primary-color);
                transform: scale(1.08);
            }

            .ol-popup-closer:hover::after {
                color: #ffffff;
            }

            #popup-content {
                font-size: 0.9rem;
                line-height: 1.6;
                color: var(--text-main);
            }

            #popup-content th {
                text-align: left;
                color: var(--text-muted);
                font-size: 0.8rem;
                padding-right: 0.75rem;
                vertical-align: top;
            }

            #popup-content td {
                font-weight: 500;
            }

            /* フローティング案内カード */
            .info-overlay {
                position: absolute;
                bottom: 2rem;
                left: 1.5rem;
                background: var(--bg-glass);
                backdrop-filter: blur(10px);
                padding: 0.85rem 1.2rem;
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-sm);
                border: 1px solid rgba(255,255,255,0.8);
                z-index: 500;
                pointer-events: none;
                max-width: 300px;
            }

            .info-overlay h3 {
                font-size: 0.85rem;
                font-weight: 700;
                color: var(--primary-color);
                margin-bottom: 0.2rem;
            }

            .info-overlay p {
                font-size: 0.75rem;
                color: var(--text-muted);
            }
        </style>
    </head>
    <body>

        <div class="app-container">
            <!-- モダンヘッダー -->
            <header>
                <div class="header-left">
                    <a href="../index.html" class="back-btn">
                        ← 日本地図へ戻る
                    </a>
                    <div class="header-title-group">
                        <h1>
                            <span class="badge-pref">22</span>
                            風景印保有局（静岡県）
                        </h1>
                    </div>
                </div>
            </header>

            <!-- 地図表示エリア -->
            <div id="map-wrapper">
                <div id="map">
                    <div id="popup" class="ol-popup">
                        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                        <div id="popup-content"></div>
                    </div>
                </div>

                <!-- フローティング案内カード -->
                <div class="info-overlay">
                    <h3>📍 静岡県の風景印配置郵便局</h3>
                    <p>マップ上のピンをクリックすると、郵便局名や風景印の詳細情報を確認できます。</p>
                </div>
            </div>
        </div>

        <!-- スクリプト類（互換性を維持） -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/P3013_22_1.js"></script>
        <script src="styles/P3013_22_1_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script>
            (function() {
                window.addEventListener('load', function() {
                    if (typeof map !== 'undefined' && map && map.forEachFeatureAtPixel) {
                        // スマホ判定 (画面幅768px以下、またはモバイル端末)
                        var isMobile = window.innerWidth <= 768 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                        
                        if (isMobile) {
                            // OpenLayersの判定関数を安全にフックして、スマホ時のみ15pxの判定許容エリアを自動適用
                            var originalForEachFeatureAtPixel = map.forEachFeatureAtPixel.bind(map);
                            map.forEachFeatureAtPixel = function(pixel, callback, options) {
                                options = options || {};
                                if (options.hitTolerance === undefined || options.hitTolerance < 15) {
                                    options.hitTolerance = 15; // スマホ時はタップ許容エリアを15pxに自動拡張
                                }
                                return originalForEachFeatureAtPixel(pixel, callback, options);
                            };
                        }
                    }
                });
            })();
        </script>
    </body>
</html>
