.result-item:hover, .result-item:focus { background: #f2f6fc; outline: none; }
.result-empty { padding: 16px; color: #777; font-size: .9rem; }
@media (max-width: 760px) {

    #results-panel { width: 100%; flex: 0 0 38%; border-left: 0; border-top: 1px solid #ddd; }
}

  <script>
// =====================================================
// 検索・強調表示
// =====================================================

let highlightLayer = new ol.layer.Vector({
    source: new ol.source.Vector()
});

map.addLayer(highlightLayer);

const searchInput =
    document.getElementById(
        "officeSearch"
    );

const searchButton =
    document.getElementById(
        "searchBtn"
    );

const resultsBox =
    document.getElementById(
        "searchResults"
    );

const resultsSummary =
    document.getElementById(
        "results-summary"
    );

function getOfficeName(feature){

    return (
        feature.get(
            "post_offices_name"
        ) || ""
    ).trim();

}

function highlightFeatures(features){

    highlightLayer
        .getSource()
        .clear();

    features.forEach(function(feature){

        const clone =
            feature.clone();

        clone.setStyle(
            new ol.style.Style({

                image:
                    new ol.style.Circle({

                        radius: 10,

                        fill:
                            new ol.style.Fill({
                                color:"#ffd700"
                            }),

                        stroke:
                            new ol.style.Stroke({
                                color:"#ff0000",
                                width:3
                            })

                    })

            })
        );

        highlightLayer
            .getSource()
            .addFeature(clone);

    });

}

function zoomToFeature(feature){

    map.getView().fit(

        feature
            .getGeometry()
            .getExtent(),

        {

            padding:
                [40,40,40,40],

            maxZoom:16,

            duration:800

        }

    );

}

function findPostOffice(){

    let keyword =
        searchInput.value.trim();

    resultsBox.innerHTML = "";

    highlightLayer
        .getSource()
        .clear();

    if(!keyword){

        resultsSummary.textContent =
            "検索語を入力してください。";

        resultsBox.innerHTML =
            '<div class="result-empty">郵便局名を入力してください。</div>';

        return;

    }

    const baseKeyword =
        keyword.replace(
            /郵便局$/,
            ""
        );

    const exactKeyword =
        baseKeyword + "郵便局";

    const features =
        lyr_post_All_1
            .getSource()
            .getFeatures();

    // ------------------
    // 1. 完全一致
    // A郵便局
    // ------------------

    const exactMatches =
        features.filter(f => {

            const name =
                getOfficeName(f);

            return (
                name === exactKeyword
            );

        });

    // ------------------
    // 2. 前方一致
    // A郵便局xx
    // Axx郵便局
    // ------------------

    const prefixMatches =
        features.filter(f => {

            const name =
                getOfficeName(f);

            if(
                exactMatches.includes(f)
            ){
                return false;
            }

            return (
                name.startsWith(
                    baseKeyword
                )
            );

        });

    // ------------------
    // 3. 後方一致
    // xxA郵便局
    // ------------------

    const suffixMatches =
        features.filter(f => {

            const name =
                getOfficeName(f);

            if(
                exactMatches.includes(f) ||
                prefixMatches.includes(f)
            ){
                return false;
            }

            return (
                name.endsWith(
                    exactKeyword
                )
            );

        });

    // ------------------
    // 4. 部分一致
    // xxAxx郵便局
    // ------------------

    const containsMatches =
        features.filter(f => {

            const name =
                getOfficeName(f);

            if(
                exactMatches.includes(f) ||
                prefixMatches.includes(f) ||
                suffixMatches.includes(f)
            ){
                return false;
            }

            return (
                name.includes(
                    baseKeyword
                )
            );

        });

    const matches = [

        ...exactMatches,
        ...prefixMatches,
        ...suffixMatches,
        ...containsMatches

    ];

    highlightFeatures(
        matches
    );

    resultsSummary.textContent =
        matches.length +
        " 件見つかりました";

    if(
        matches.length === 0
    ){

        resultsBox.innerHTML =
            '<div class="result-empty">該当局なし</div>';

        return;

    }

    const groups = [

        {
            label:"完全一致",
            features:exactMatches
        },

        {
            label:"前方一致",
            features:prefixMatches
        },

        {
            label:"後方一致",
            features:suffixMatches
        },

        {
            label:"部分一致",
            features:containsMatches
        }

    ];

    groups.forEach(function(group){

        if(
            group.features.length === 0
        ){
            return;
        }

        const heading =
            document.createElement(
                "div"
            );

        heading.className =
            "result-group-heading";

        heading.textContent =
            group.label +
            "（" +
            group.features.length +
            "件）";

        resultsBox.appendChild(
            heading
        );

        group.features.forEach(
            function(feature){

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "result-item";

                const name =
                    getOfficeName(
                        feature
                    );

                const pref =
                    feature.get(
                        "post_offices_prefecture"
                    ) || "";

                item.textContent =
                    name +
                    "（" +
                    pref +
                    "）";

                item.addEventListener(
                    "click",
                    function(){

                        zoomToFeature(
                            feature
                        );

                    }
                );

                item.addEventListener(
                    "dblclick",
                    function(){

                        zoomToFeature(
                            feature
                        );

                    }
                );

                resultsBox.appendChild(
                    item
                );

            }
        );

    });

}

searchButton.addEventListener(
    "click",
    findPostOffice
);

searchInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){
            findPostOffice();
        }

    }
);

const PREFECTURES = {

"三重県":[136.5086,34.7303],

"京都府":[135.7681,35.0116],
"大阪府":[135.5023,34.6937],
"兵庫県":[135.1955,34.6913],
"奈良県":[135.8048,34.6851],
"和歌山県":[135.1675,34.2260],

"鳥取県":[134.2383,35.5037],

"岡山県":[133.9344,34.6618],
"広島県":[132.4553,34.3852],
"山口県":[131.4705,34.1859],

"徳島県":[134.5594,34.0658],

"高知県":[133.5311,33.5597],

"福岡県":[130.4017,33.5902],
"佐賀県":[130.3009,33.2494],
"長崎県":[129.8737,32.7503],
"熊本県":[130.7417,32.8031],
"大分県":[131.6126,33.2382],
"宮崎県":[131.4202,31.9111],
"鹿児島県":[130.5581,31.5602],
"沖縄県":[127.6809,26.2124]

};

const prefectureSelect =
    document.getElementById(
        "prefectureSelect"
    );

prefectureSelect.addEventListener(
    "change",
    function () {

        const pref =
            this.value;

        const center =
            PREFECTURES[pref];

        if (
            !pref ||
            !center ||
            typeof map ===
                "undefined" ||
            !map.getView
        ) {
            return;
        }

        map.getView().animate({

            center:
                ol.proj.fromLonLat(
                    center
                ),

            zoom: 10,

            duration: 800

        });

    }
);

// ---------------------
// 更新日時表示
// ---------------------

fetch("./last_update.txt")
.then(r => r.text())
.then(text => {

    document
        .getElementById(
            "updateInfo"
        )
        .textContent =
        "最終更新: " +
        text;

})
.catch(() => {

    document
        .getElementById(
            "updateInfo"
        )
        .textContent =
        "更新日時取得失敗";

});
</script>
